type StashBox {
  endpoint: String!
  api_key: String!
  name: String!
  max_requests_per_minute: Int!
}

input StashBoxInput {
  endpoint: String!
  api_key: String!
  name: String!
  # defaults to 240
  max_requests_per_minute: Int
}

type StashID {
  endpoint: String!
  stash_id: String!
  updated_at: Time!
}

input StashIDInput {
  endpoint: String!
  stash_id: String!
  updated_at: Time
}

enum FingerprintVote {
  VALID
  INVALID
}

input FingerprintSubmissionInput {
  scene_id: ID!
  stash_box_scene_id: String!
  stash_box_endpoint: String!
  vote: FingerprintVote!
}

input StashBoxFingerprintSubmissionInput {
  scene_ids: [String!] @deprecated(reason: "use fingerprints")
  fingerprints: [FingerprintSubmissionInput!]
  stash_box_endpoint: String @deprecated(reason: "use fingerprints")
}

input StashBoxDraftSubmissionInput {
  id: String!
  stash_box_index: Int @deprecated(reason: "use stash_box_endpoint")
  stash_box_endpoint: String
}

type FingerprintSubmission {
  endpoint: String!
  stash_id: String!
  scene: Scene!
  vote: FingerprintVote!
  created_at: Time!
}

input QueueFingerprintInput {
  endpoint: String!
  stash_id: String!
  scene_id: ID!
  vote: FingerprintVote!
}

input RemoveFingerprintInput {
  endpoint: String!
  stash_id: String!
}
