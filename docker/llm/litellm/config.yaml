# LiteLLM gateway config for stash-llm.
#
# stash-llm talks ONLY to this gateway (one OpenAI-compatible client). The gateway
# owns provider auth so the stash container never holds provider secrets.
#
# Models exposed to stash-llm (set STASH_ASSISTANT_MODEL to one of these):
#   • minimax  — MiniMax-M2.7 via API key. Works headless; the default.
#   • grok     — Grok via grok.com OAuth subscription, routed to the cli-proxy-api bridge.

model_list:
  # ── MiniMax (API key, OpenAI-compatible) — reliable headless default ──────────
  - model_name: minimax
    litellm_params:
      model: minimax/MiniMax-M2.7
      api_base: https://api.minimax.io/v1
      api_key: os.environ/MINIMAX_API_KEY
      # If tool-calling misbehaves with the native provider, switch the model line
      # to:  model: openai/MiniMax-M2.7   (routes via LiteLLM's OpenAI interface)

  # ── Grok via OAuth (your grok.com SUBSCRIPTION, not metered API) ─────────────
  # Routed to the cli-proxy-api bridge container, which holds the Grok OAuth token
  # and exposes an OpenAI-compatible endpoint. See docker/llm/cliproxy/ and
  # DEPLOY-NAS.md. NOTE: subscription-OAuth-as-API is gray-area vs xAI's ToS and
  # depends on OAuth token refresh — fragile, but no metered per-token billing.
  - model_name: grok
    litellm_params:
      model: openai/grok-4.3               # model the bridge exposes (alias grok-latest)
      api_base: os.environ/GROK_PROXY_URL  # e.g. http://cli-proxy-api:8317/v1
      api_key: os.environ/GROK_PROXY_KEY   # one of cli-proxy-api's configured api-keys

litellm_settings:
  # tolerate provider-specific param differences (e.g. max_tokens handling)
  drop_params: true
  request_timeout: 600

general_settings:
  # stash-llm authenticates to the gateway with this key (STASH_ASSISTANT_API_KEY)
  master_key: os.environ/LITELLM_MASTER_KEY
