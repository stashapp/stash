# LiteLLM gateway config for stash-llm.
#
# stash-llm talks ONLY to this gateway (one OpenAI-compatible client). The gateway
# owns provider auth so the stash container never holds provider secrets.
#
# Models exposed to stash-llm (set STASH_ASSISTANT_MODEL to one of these):
#   • minimax  — MiniMax-M2.7 via API key. Works headless; the default.
#   • grok     — xAI Grok via API key (OpenAI-compatible). Works headless; compliant.

model_list:
  # ── MiniMax (API key, OpenAI-compatible) — reliable headless default ──────────
  - model_name: minimax
    litellm_params:
      model: minimax/MiniMax-M2.7
      api_base: https://api.minimax.io/v1
      api_key: os.environ/MINIMAX_API_KEY
      # If tool-calling misbehaves with the native provider, switch the model line
      # to:  model: openai/MiniMax-M2.7   (routes via LiteLLM's OpenAI interface)

  # ── xAI / Grok (API key, OpenAI-compatible) — compliant, headless, no bridge ──
  # xAI sells a first-party API (api.x.ai/v1) with function calling, so no OAuth
  # bridge is needed — just XAI_API_KEY. (Using the grok.com *subscription* via
  # OAuth instead would require a CLIProxyAPI-style bridge with the same ToS/
  # fragility tradeoffs as Claude-OAuth — not recommended; use the API key.)
  # Adjust the model id to whatever's current on your xAI account.
  - model_name: grok
    litellm_params:
      model: xai/grok-4.3
      api_key: os.environ/XAI_API_KEY

litellm_settings:
  # tolerate provider-specific param differences (e.g. max_tokens handling)
  drop_params: true
  request_timeout: 600

general_settings:
  # stash-llm authenticates to the gateway with this key (STASH_ASSISTANT_API_KEY)
  master_key: os.environ/LITELLM_MASTER_KEY
